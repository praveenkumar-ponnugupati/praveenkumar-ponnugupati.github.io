name: Update GitHub contribution count

# Refreshes the number shown on the portfolio hero tile.
# Runs every Monday, and can be triggered by hand from the Actions tab.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the contribution total
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_contributions.py

      - name: Commit if the number moved
        run: |
          if git diff --quiet -- data/github.json index.html; then
            echo "Count unchanged, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json index.html
          git commit -m "Update GitHub contribution count"
          git push
